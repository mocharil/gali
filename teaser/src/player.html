<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GALI Teaser</title>
  <style>
    /*{{FONTS}}*/
    *{box-sizing:border-box}
    body{margin:0;background:#04070c;color:#e2e8f0;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
    .player{width:min(100vw,1600px);padding:18px}
    .stage{position:relative;aspect-ratio:16/9;background:#060911;border:1px solid #1e293b;border-radius:12px;overflow:hidden;box-shadow:0 28px 100px #0009}
    canvas{display:block;width:100%;height:100%}
    .controls{display:flex;align-items:center;gap:12px;padding:14px 2px;font-size:14px;color:#94a3b8}
    button{background:#0f172a;color:#e2e8f0;border:1px solid #273449;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600}
    button:hover{border-color:#fbbf24;color:#fbbf24}
    button:focus-visible,input:focus-visible{outline:2px solid #fbbf24;outline-offset:3px}
    #seek{flex:1;min-width:60px;accent-color:#fbbf24}
    #time{font-family:"JetBrains Mono",Consolas,monospace;min-width:110px;text-align:right}
    .note{font-size:12px;color:#64748b;margin:0 2px 8px;line-height:1.5}
    .stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0;display:grid;place-items:center}
    .stage:fullscreen canvas{width:100%;height:auto;max-height:100vh}
    @media(max-width:640px){.player{padding:6px}.controls{gap:6px;font-size:12px}button{padding:8px 10px}}
  </style>
</head>
<body>
<main class="player">
  <div class="stage" id="stage"><canvas id="film" width="1920" height="1080" role="img" aria-label="GALI teaser: who GALI is for, the scattered-data problem, the stock-to-mine link, reserve life, license expiry, cost-curve margins, export dependence and Scenario Studio."></canvas></div>
  <div class="controls">
    <button id="play" aria-label="Play or pause">Play</button>
    <button id="mute" aria-label="Mute or unmute music">Sound on</button>
    <input id="seek" aria-label="Playback position" type="range" min="0" max="60" step="0.01" value="0">
    <span id="time">00:00 / 01:00</span>
    <button id="full" aria-label="Fullscreen">Fullscreen</button>
  </div>
  <p class="note">GALI teaser · 60 s · 1920×1080. Figures are a snapshot of the live GALI API (<span id="asof"></span>); map outlines from Natural Earth. Space = play/pause, ←/→ = ±1 s. Analytics on public data, not investment advice.</p>
</main>
<audio id="audio" preload="auto" src="{{AUDIO}}"></audio>
<script>window.GALI_LOGO="{{LOGO}}";</script>
<script>window.GALI_DATA={{DATA}};</script>
<script>window.GALI_GEO={{GEO}};</script>
<script>
{{FILM}}
</script>
<script>
'use strict';
(() => {
  const DURATION = window.filmInfo.duration;
  const audio = document.getElementById('audio'), play = document.getElementById('play'), seek = document.getElementById('seek'), timeLabel = document.getElementById('time'), mute = document.getElementById('mute');
  document.getElementById('asof').textContent = `as of ${window.GALI_DATA.as_of}`;
  let playing = false, current = 0, raf = 0, startedAt = 0;
  const fmt = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  function show(t) { current = Math.max(0, Math.min(DURATION, t)); window.renderFrame(current); seek.value = current; timeLabel.textContent = `${fmt(current)} / ${fmt(DURATION)}`; }
  function stop() { playing = false; audio.pause(); play.textContent = current >= DURATION - .05 ? 'Replay' : 'Play'; cancelAnimationFrame(raf); }
  function tick(now) {
    if (!playing) return;
    const t = audio.readyState >= 2 && !audio.paused ? audio.currentTime : (now - startedAt) / 1000;
    show(t);
    if (t >= DURATION - .02) { show(DURATION); stop(); return; }
    raf = requestAnimationFrame(tick);
  }
  play.onclick = async () => {
    if (playing) { stop(); return; }
    if (current >= DURATION - .1) current = 0;
    audio.currentTime = current; startedAt = performance.now() - current * 1000; playing = true; play.textContent = 'Pause';
    try { await audio.play(); } catch { mute.textContent = 'No sound'; }
    raf = requestAnimationFrame(tick);
  };
  seek.oninput = () => { show(+seek.value); audio.currentTime = current; startedAt = performance.now() - current * 1000; };
  mute.onclick = () => { audio.muted = !audio.muted; mute.textContent = audio.muted ? 'Sound off' : 'Sound on'; };
  document.getElementById('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.getElementById('stage').requestFullscreen();
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.code !== 'Space') return;
    if (e.code === 'Space') { e.preventDefault(); play.click(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { show(current + (e.code === 'ArrowRight' ? 1 : -1)); audio.currentTime = current; startedAt = performance.now() - current * 1000; }
  });
  const start = parseFloat(new URLSearchParams(location.search).get('t'));
  window.__ready.then(() => show(Number.isFinite(start) ? start : 0));
})();
</script>
</body>
</html>
