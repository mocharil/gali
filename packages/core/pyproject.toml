[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gali-core"
version = "0.1.0"
description = "GALI domain core: Sectors API client, data model, entity graph, metric engines."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=9.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "typer>=0.15",
  "rich>=13.9",
  "pandas>=2.2",
  "numpy>=2.0",
  "rapidfuzz>=3.10",
  "python-dateutil>=2.9",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil",
]

[project.scripts]
gali = "gali_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gali_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

