name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[dev]" -e "packages/api[dev]" -e "packages/pipeline[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Typechecker
        run: mypy packages/core/gali_core

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gali
          POSTGRES_PASSWORD: gali
          POSTGRES_DB: gali
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[dev]" -e "packages/api[dev]" -e "packages/pipeline[dev]"

      - name: Setup Postgres extensions
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=gali psql -h localhost -p 5432 -U gali -d gali -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gin;"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://gali:gali@localhost:5432/gali
          DATABASE_URL_SYNC: postgresql+psycopg://gali:gali@localhost:5432/gali
          ENVIRONMENT: test
        run: |
          alembic -c packages/core/alembic.ini upgrade head

      - name: Run all core and API tests
        env:
          DATABASE_URL: postgresql+asyncpg://gali:gali@localhost:5432/gali
          DATABASE_URL_SYNC: postgresql+psycopg://gali:gali@localhost:5432/gali
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          GALI_DRY_RUN: "1"
          GALI_QA_FIXTURES: "1"
        run: |
          pytest packages/core/tests packages/api/tests packages/pipeline/tests -v --cov=gali_core

  frontend:
    name: Frontend build and E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gali
          POSTGRES_PASSWORD: gali
          POSTGRES_DB: gali
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://gali:gali@localhost:5432/gali
      DATABASE_URL_SYNC: postgresql+psycopg://gali:gali@localhost:5432/gali
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      GALI_QA_FIXTURES: "1"
      GALI_DRY_RUN: "1"
      # One local proxy IP serves all browser cases; quota behavior has separate security tests.
      RATE_LIMIT_ANON_PER_MIN: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Prepare test database
        run: |
          pip install -e "packages/core[dev]" -e "packages/api[dev]"
          alembic -c packages/core/alembic.ini upgrade head
          python scripts/seed_test_database.py
      - name: Build frontend and verify API schema
        working-directory: packages/web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- lib/schema.ts
          npm run typecheck
          npm run lint
          npm run build
      - name: Browser regression tests
        working-directory: packages/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: packages/web/test-results
