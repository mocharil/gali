# fly.toml app configuration file generated for GALI API on Fly.io
app = "gali-api"
primary_region = "sin"

[build]
  dockerfile = "infra/Dockerfile.api"

[env]
  PORT = "8000"
  GALI_ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
